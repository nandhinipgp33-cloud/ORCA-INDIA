services:
  database:
    image: postgis/postgis:16-3.4
    container_name: orca-india-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orca_india}
      POSTGRES_USER: ${POSTGRES_USER:-orca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orca} -d ${POSTGRES_DB:-orca_india}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
